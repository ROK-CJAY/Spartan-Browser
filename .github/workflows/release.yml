name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Attach policy to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            policy/desk-policy.json
            public/desk-policy.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
